# Build static site and deploy to GitHub Pages.
# Prerequisite: Settings → Pages → Source: GitHub Actions, then Re-run this workflow (or push).
# Custom domain: Settings → Pages + DNS (see hookedshorts-site/部署与上线步骤.md).
name: Deploy Hooked Shorts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hookedshorts-site/**"
      - ".github/workflows/deploy-hookedshorts-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-flight deploy; can leave the site half-published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job: upload + deploy in one graph (avoids cross-job artifact edge cases).
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hookedshorts-site/package-lock.json

      - name: Install and build
        run: |
          cd hookedshorts-site
          npm ci
          npm run build

      - name: Upload static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: hookedshorts-site/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Lint + production build + static smoke test for the marketing site.
name: hookedshorts-site

on:
  push:
    paths:
      - "hookedshorts-site/**"
      - ".github/workflows/hookedshorts-site.yml"
  pull_request:
    paths:
      - "hookedshorts-site/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: hookedshorts-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hookedshorts-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify static output
        run: npm run verify
